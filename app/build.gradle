plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nekomusic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nekomusic'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField "String", "API_BASE_URL", "\"https://neko-music-api.onrender.com\""
    }
}
